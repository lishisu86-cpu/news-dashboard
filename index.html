<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-tr="page_title">AI Coworker - Daily News Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-logo">
                <div class="logo-icon"></div>
                <div class="logo-text">
                    <h1 id="logo-title">Antigravity News</h1>
                    <p id="logo-sub">Your Intelligent Coworker's Daily Briefing</p>
                </div>
            </div>
            <div class="header-actions">
                <button id="lang-btn" class="lang-btn">
                    <span class="lang-icon">🌐</span>
                    <span id="lang-label">English</span>
                </button>
                <div class="status-badge" id="status-badge">
                    <span class="pulse-dot"></span>
                    <span id="update-time" data-tr="loading_data">正在载入新闻数据...</span>
                </div>
            </div>
        </header>

        <!-- Navigation Tabs Bar -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="finance">
                <span class="tab-icon">📈</span>
                <span class="tab-label" id="tab-finance-label">投资金融</span>
            </button>
            <button class="tab-btn" data-tab="sports">
                <span class="tab-icon">⚽</span>
                <span class="tab-label" id="tab-sports-label">世界杯体育</span>
            </button>
            <button class="tab-btn" data-tab="tech">
                <span class="tab-icon">💻</span>
                <span class="tab-label" id="tab-tech-label">科技前沿</span>
            </button>
            <button class="tab-btn" data-tab="entertainment">
                <span class="tab-icon">🎭</span>
                <span class="tab-label" id="tab-entertainment-label">娱乐生活</span>
            </button>
        </nav>

        <!-- Control Panel (Search & Sub-Filters) -->
        <section class="controls">
            <!-- Search Bar -->
            <div class="search-box">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="search-input" placeholder="搜索新闻、关键词或来源...">
            </div>

            <!-- Source Quick Badges Filters -->
            <div class="sub-filters" id="sub-filters">
                <!-- Loaded dynamically by active tab sources -->
            </div>
        </section>

        <!-- Widgets Area (Shows Conditionally per Tab) -->
        <section class="widgets-area">
            <!-- Market Rates Widget (Finance Only) -->
            <div id="market-widget" class="market-widget">
                <!-- Market cards populated by js -->
            </div>

            <!-- World Cup Scoreboard Widget (Sports Only) -->
            <div id="sports-widget" class="sports-widget" style="display: none;">
                <!-- Sports scores cards populated by js -->
            </div>
        </section>

        <!-- Main Content -->
        <main>
            <!-- Stats Summary -->
            <div class="summary-cards">
                <div class="summary-card">
                    <span class="card-label" id="lbl-stat-total">板块文章总数</span>
                    <span class="card-value" id="stat-total">0</span>
                </div>
                <div class="summary-card">
                    <span class="card-label" id="lbl-stat-zh">中文报道</span>
                    <span class="card-value" id="stat-zh">0</span>
                </div>
                <div class="summary-card">
                    <span class="card-label" id="lbl-stat-en">英文报道</span>
                    <span class="card-value" id="stat-en">0</span>
                </div>
            </div>

            <!-- News Grid -->
            <div class="news-grid" id="news-grid">
                <!-- Loading skeletons -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p id="footer-text">Built autonomously by <strong>Antigravity AI</strong> — Your ultimate coding & operational partner.</p>
        </footer>
    </div>

    <script src="index.js"></script>
</body>
</html>
